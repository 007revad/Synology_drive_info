name: Build n Release Drive Info Package

env:
  # --- Edit these when reusing for a different package ---
  REPO_NAME: "Synology_drive_info"
  SPK_PREFIX: "Drive_Info"
  HELPER_NAME: "driveinfo"
  MAIN_JS_NAME: "drive_info"

  # --- Runner config, shouldn't need to change ---
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-spk:
    name: Build Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These 4 cover all models that can use DSM 7
        arch: ['kvmx64', 'rtd1296', 'armada38x', 'evansport']
        #dsm: ['7.0','7.1','7.2','7.3',"7.4"]
        dsm: ['7.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get release tag
        id: get_latest_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "new_tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            # Get most recent release including pre-releases
            response=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/007revad/${REPO_NAME}/releases?per_page=1")
            latest_tag=$(echo "$response" | jq -r 'if type == "array" then .[0].tag_name // empty else empty end')
            if [ -z "$latest_tag" ]; then
              echo "ERROR: Could not determine release tag. API response:" >&2
              echo "$response" >&2
              exit 1
            fi
            echo "new_tag=$latest_tag" >> $GITHUB_OUTPUT
          fi

      - name: Determine DSM suffix
        id: dsm_suffix
        run: |
          # Count how many DSM versions are in the matrix
          dsm_list='${{ toJSON(matrix.dsm) }}'
          count=$(echo "$dsm_list" | jq 'if type == "array" then length else 1 end')
          current="${{ matrix.dsm }}"
          if [ "$count" -eq 1 ] && [ "$current" = "7.0" ]; then
            echo "suffix=DSM-7.x" >> $GITHUB_OUTPUT
          else
            echo "suffix=DSM-${current}" >> $GITHUB_OUTPUT
          fi

      - name: Check if SPKs already exist in release
        id: check_assets
        run: |
          existing=$(curl -s "https://api.github.com/repos/007revad/${REPO_NAME}/releases/tags/${{ steps.get_latest_tag.outputs.new_tag }}" \
            | jq -r '.assets[].name' | grep -c '\.spk' || true)
          echo "spk_count=$existing" >> $GITHUB_OUTPUT

      # Synology's own platform codes (kvmx64, rtd1296, ...) aren't
      # meaningful to someone picking a download - map to the arch
      # label people actually recognize.
      - name: Map arch to display label
        id: arch_label
        run: |
          case "${{ matrix.arch }}" in
            kvmx64) label="x86_64" ;;
            rtd1296) label="armv8" ;;
            armada38x) label="armv7" ;;
            evansport) label="i686" ;;
            *) echo "::error::No display label mapped for arch '${{ matrix.arch }}'"; exit 1 ;;
          esac
          echo "label=$label" >> $GITHUB_OUTPUT

      # NEW: what actually goes in INFO's arch= field
      - name: Map arch to INFO install-arch list
        id: install_arch
        run: |
          case "${{ matrix.arch }}" in
            kvmx64) archlist="x86_x64" ;;
            rtd1296) archlist="armv8" ;;
            armada38x) archlist="alpine alpine4k armada370 armada375 armada38x armadaxp monaco comcerto2k" ;;
            evansport) archlist="evansport" ;;
            *) echo "::error::No install-arch list mapped for '${{ matrix.arch }}'"; exit 1 ;;
          esac
          echo "archlist=$archlist" >> $GITHUB_OUTPUT

      - name: Version-stamp main.js filename
        # Also edits config to match new main.js file name
        # Forces DSM to load current file and not cached file after package update
        if: steps.check_assets.outputs.spk_count == '0'
        run: |
          set -euo pipefail
          version="${{ steps.get_latest_tag.outputs.new_tag }}"
          version="${version#v}"   # v1.0.27 -> 1.0.27, to match SYNOPKG_PKGVER
          mv src/ui/${MAIN_JS_NAME}.js "src/ui/${MAIN_JS_NAME}-${version}.js"
          sed -i "s/\"${MAIN_JS_NAME}\.js\":/\"${MAIN_JS_NAME}-${version}.js\":/" src/ui/config
          grep -q "\"${MAIN_JS_NAME}-${version}\.js\"" src/ui/config \
          || { echo "::error::config was not updated with ${MAIN_JS_NAME}-${version}.js"; exit 1; }

      - name: Synology Package Builder Github Action
        if: steps.check_assets.outputs.spk_count == '0'
        #uses: tomgrv/synology-package-builder@v1.3.0
        uses: 007revad/synology-package-builder@main
        with:
          dsm: ${{ matrix.dsm }}
          arch: ${{ matrix.arch }}
          output: ./dist

      # SynoBuild/PkgCreate.py don't reliably fail the Action when our
      # custom post-make helper-compile step (in stubs/SynoBuildConf/build)
      # errors out - the log shows Synology's own tooling can still emit
      # a .spk in that case. Check the actual built artifact instead of
      # trusting the exit code chain through Synology's build driver.
      - name: Verify setuid helper compiled correctly
        if: steps.check_assets.outputs.spk_count == '0'
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            kvmx64)    expect_arch="x86-64" ;;
            rtd1296)   expect_arch="ARM aarch64" ;;
            armada38x) expect_arch="ARM" ;;
            evansport) expect_arch="Intel 80386" ;;
            *) echo "::error::No expected ELF arch mapped for '${{ matrix.arch }}'"; exit 1 ;;
          esac

          spk=$(ls ./dist/*.spk | grep -v _debug | head -n1)
          if [ -z "$spk" ]; then
            echo "::error::No non-debug .spk found in ./dist"
            exit 1
          fi

          workdir=$(mktemp -d)
          tar -xf "$spk" -C "$workdir" package.tgz
          tar -xf "$workdir/package.tgz" -C "$workdir" bin/helper/${HELPER_NAME}-helper

          helper="$workdir/bin/helper/${HELPER_NAME}-helper"
          if [ ! -s "$helper" ]; then
            echo "::error::${HELPER_NAME}-helper missing or empty in $spk - helper compile likely failed silently"
            exit 1
          fi

          file_out=$(file -b "$helper")
          echo "${HELPER_NAME}-helper: $file_out"
          case "$file_out" in
            *"$expect_arch"*) echo "OK: matches expected arch '$expect_arch'" ;;
            *)
              echo "::error::${HELPER_NAME}-helper in $spk doesn't look like '$expect_arch' (got: $file_out) - wrong-arch compiler was likely used"
              exit 1
              ;;
          esac

          rm -rf "$workdir"

      - name: Remove debug spk and rename package
        if: steps.check_assets.outputs.spk_count == '0'
        run: |
          ls -l ./dist
          rm -f ./dist/*_debug.spk
          for f in ./dist/*.spk; do
            mv "$f" "./dist/${SPK_PREFIX}-${{ steps.arch_label.outputs.label }}-${{ steps.get_latest_tag.outputs.new_tag }}-${{ steps.dsm_suffix.outputs.suffix }}.spk"
          done
          ls -l ./dist

      - name: Fix arch field in INFO for non-x86_64 DSM 7 platforms
        if: steps.check_assets.outputs.spk_count == '0' && matrix.arch != 'kvmx64'
        run: |
          set -euo pipefail
          spk=$(ls ./dist/*.spk | head -n1)
          tmpdir=$(mktemp -d)
          tar -xf "$spk" -C "$tmpdir"
          sed -i '/^arch=/s/.*/arch="${{ steps.install_arch.outputs.archlist }}"/' "$tmpdir/INFO"
          tar -cf "$spk" -C "$tmpdir" $(ls "$tmpdir")
          rm -rf "$tmpdir"

      # Only needs to happen once - the noarch/DSM6 output doesn't
      # depend on which arch built it, and running it per matrix leg
      # would just produce duplicate, colliding artifacts.
      - name: Create noarch package for DSM 6
        if: steps.check_assets.outputs.spk_count == '0' && matrix.arch == 'kvmx64'
        run: |
          for f in ./dist/${SPK_PREFIX}-${{ steps.arch_label.outputs.label }}-*.spk; do
            dsm6="${f/${{ steps.arch_label.outputs.label }}/noarch}"
            dsm6="${dsm6/${{ steps.dsm_suffix.outputs.suffix }}/DSM-6.x}"
            tmpdir=$(mktemp -d)
            tar -xf "$f" -C "$tmpdir"
            sed -i 's/arch=".*"/arch="noarch"/' "$tmpdir/INFO"
            sed -i -E 's/os_min_ver="7\.0-[0-9]+"/os_min_ver="6.0-7321"/' "$tmpdir/INFO"
            sed -i 's/os_max_ver="9.9-99999"/os_max_ver="6.9-99999"/' "$tmpdir/INFO"
            sed -i -E 's/install_dep_packages="[^"]*"/install_dep_packages="py3k>=3.8.6-0154"/' "$tmpdir/INFO"
            rm -rf "$tmpdir/WIZARD_UIFILES"
            rm -rf "$tmpdir/conf"
            rm -rf "$tmpdir/helper"
            tar -cf "$dsm6" -C "$tmpdir" $(ls "$tmpdir")
            rm -rf "$tmpdir"
          done
          ls -l ./dist

      - name: Upload Package
        if: steps.check_assets.outputs.spk_count == '0'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SPK_PREFIX }}-${{ steps.arch_label.outputs.label }}-${{ steps.dsm_suffix.outputs.suffix }}
          path: ./dist/*.spk

      - name: Release
        if: steps.check_assets.outputs.spk_count == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_latest_tag.outputs.new_tag }}
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            ./dist/*.spk

  notify-spkrepo:
    runs-on: ubuntu-latest
    needs: [build-spk]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout this repo (for synology/PACKAGE_ICON.PNG and package.json)
        uses: actions/checkout@v6

      - name: Checkout 007revad.github.io (for thumbnails/)
        uses: actions/checkout@v6
        with:
          repository: 007revad/007revad.github.io
          token: ${{ secrets.SYNC_TOKEN }}
          path: _github_io

      - name: Install ImageMagick
        run: sudo apt-get install -y --no-install-recommends imagemagick

      - name: Resize icon and push thumbnail
        run: |
          set -euo pipefail

          # Read package ID from package.json
          # package.json may be at the repo root or under synology/ depending on the repo
          if [ -f "synology/package.json" ]; then
            PKG_JSON="synology/package.json"
          elif [ -f "package.json" ]; then
            PKG_JSON="package.json"
          else
            echo "ERROR: package.json not found" >&2
            exit 1
          fi

          PKG_NAME=$(jq -r '.package' "${PKG_JSON}")
          DEST="_github_io/spkrepo/thumbnails/${PKG_NAME}_120.png"

          # Resize 256x256 PACKAGE_ICON.PNG → 120x120 PNG
          mkdir -p "_github_io/spkrepo/thumbnails"
          /usr/bin/convert synology/PACKAGE_ICON.PNG \
            -resize 120x120 \
            -gravity center \
            -extent 120x120 \
            "${DEST}"

          # Commit and push if the thumbnail changed (or is new)
          cd _github_io
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "spkrepo/thumbnails/${PKG_NAME}_120.png"
          if git diff --cached --quiet; then
            echo "Thumbnail unchanged — skipping commit."
          else
            git commit -m "chore: update spkrepo thumbnail for ${PKG_NAME} [skip ci]"
            git push
          fi

      - name: Trigger spkrepo index rebuild
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/007revad/007revad.github.io/dispatches \
            --data '{
              "event_type": "spk-release",
              "client_payload": {
                "repo":    "${{ github.repository }}",
                "tag":     "${{ github.event.release.tag_name }}"
              }
            }'
