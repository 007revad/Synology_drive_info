name: TEST Build Drive Info Test Package

env:
  # --- Edit these when reusing for a different package ---
  REPO_NAME: "Synology_drive_info"
  SPK_PREFIX: "Drive_Info"
  HELPER_NAME: "driveinfo"
  MAIN_JS_NAME: "drive_info"

  # --- Runner config, shouldn't need to change ---
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      test_tag:
        # Set zip file name
        description: 'Version for this test build (also used to name the downloadable artifact zip - never published)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-test-spk:
    name: Build Test Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These 4 cover all models that can use DSM 7
        arch: ['kvmx64', 'rtd1296', 'armada38x', 'evansport']
        #dsm: ['7.0','7.1','7.2','7.3',"7.4"]
        dsm: ['7.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get test tag
        id: get_tag
        run: |
          test_tag="${{ github.event.inputs.test_tag }}"
          if [ -z "$test_tag" ]; then
            test_tag="test-${{ github.run_number }}"
          fi
          echo "new_tag=$test_tag" >> $GITHUB_OUTPUT

      - name: Determine DSM suffix
        id: dsm_suffix
        run: |
          # Count how many DSM versions are in the matrix
          dsm_list='${{ toJSON(matrix.dsm) }}'
          count=$(echo "$dsm_list" | jq 'if type == "array" then length else 1 end')
          current="${{ matrix.dsm }}"
          if [ "$count" -eq 1 ] && [ "$current" = "7.0" ]; then
            echo "suffix=DSM-7.x" >> $GITHUB_OUTPUT
          else
            echo "suffix=DSM-${current}" >> $GITHUB_OUTPUT
          fi

      # Synology's own platform codes (kvmx64, rtd1296, ...) aren't
      # meaningful to someone picking a download - map to the arch
      # label people actually recognize.
      - name: Map arch to display label
        id: arch_label
        run: |
          case "${{ matrix.arch }}" in
            kvmx64) label="x86_64" ;;
            rtd1296) label="armv8" ;;
            armada38x) label="armv7" ;;
            evansport) label="i686" ;;
            *) echo "::error::No display label mapped for arch '${{ matrix.arch }}'"; exit 1 ;;
          esac
          echo "label=$label" >> $GITHUB_OUTPUT

      # NEW: what actually goes in INFO's arch= field
      - name: Map arch to INFO install-arch list
        id: install_arch
        run: |
          case "${{ matrix.arch }}" in
            kvmx64) archlist="x86_x64" ;;
            rtd1296) archlist="armv8" ;;
            armada38x) archlist="alpine alpine4k armada370 armada375 armada38x armadaxp monaco comcerto2k" ;;
            evansport) archlist="evansport" ;;
            *) echo "::error::No install-arch list mapped for '${{ matrix.arch }}'"; exit 1 ;;
          esac
          echo "archlist=$archlist" >> $GITHUB_OUTPUT

      - name: Version-stamp main.js filename
        # Also edits config to match new main.js file name
        # Forces DSM to load current file and not cached file after package update
        run: |
          set -euo pipefail
          version="${{ steps.get_tag.outputs.new_tag }}"
          version="${version#v}"   # v1.0.27 -> 1.0.27, to match SYNOPKG_PKGVER
          mv src/ui/${MAIN_JS_NAME}.js "src/ui/${MAIN_JS_NAME}-${version}.js"
          sed -i "s/\"${MAIN_JS_NAME}\.js\":/\"${MAIN_JS_NAME}-${version}.js\":/" src/ui/config
          grep -q "\"${MAIN_JS_NAME}-${version}\.js\"" src/ui/config \
          || { echo "::error::config was not updated with ${MAIN_JS_NAME}-${version}.js"; exit 1; }

      # SRM 1.3 has no bash (BusyBox ash only) and only has smartctl 6.5, so
      # the SRM package bundles static bash 5.2 and static smartctl 7.5
      # binaries (armv7-hf and aarch64). They live in srm/bash/ and
      # srm/smartctl/ in the repo, outside src/, so the package builder never
      # puts them in the DSM 6/7 packages. Fail early if one is missing.
      - name: Check SRM bundled binaries
        if: matrix.arch == 'kvmx64'
        run: |
          set -euo pipefail
          for f in srm/bash/bash-armv7-hf-static srm/bash/bash-aarch64-static \
                   srm/smartctl/smartctl-armv7-hf-static srm/smartctl/smartctl-aarch64-static; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing"
              exit 1
            fi
          done

      - name: Synology Package Builder Github Action
        uses: 007revad/synology-package-builder@main
        with:
          dsm: ${{ matrix.dsm }}
          arch: ${{ matrix.arch }}
          output: ./dist

      # SynoBuild/PkgCreate.py don't reliably fail the Action when our
      # custom post-make helper-compile step (in stubs/SynoBuildConf/build)
      # errors out - the log shows Synology's own tooling can still emit
      # a .spk in that case. Check the actual built artifact instead of
      # trusting the exit code chain through Synology's build driver.
      - name: Verify setuid helper compiled correctly
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            kvmx64)    expect_arch="x86-64" ;;
            rtd1296)   expect_arch="ARM aarch64" ;;
            armada38x) expect_arch="ARM" ;;
            evansport) expect_arch="Intel 80386" ;;
            *) echo "::error::No expected ELF arch mapped for '${{ matrix.arch }}'"; exit 1 ;;
          esac

          spk=$(ls ./dist/*.spk | grep -v _debug | head -n1)
          if [ -z "$spk" ]; then
            echo "::error::No non-debug .spk found in ./dist"
            exit 1
          fi

          workdir=$(mktemp -d)
          tar -xf "$spk" -C "$workdir" package.tgz
          tar -xf "$workdir/package.tgz" -C "$workdir" bin/helper/${HELPER_NAME}-helper

          helper="$workdir/bin/helper/${HELPER_NAME}-helper"
          if [ ! -s "$helper" ]; then
            echo "::error::${HELPER_NAME}-helper missing or empty in $spk - helper compile likely failed silently"
            exit 1
          fi

          file_out=$(file -b "$helper")
          echo "${HELPER_NAME}-helper: $file_out"
          case "$file_out" in
            *"$expect_arch"*) echo "OK: matches expected arch '$expect_arch'" ;;
            *)
              echo "::error::${HELPER_NAME}-helper in $spk doesn't look like '$expect_arch' (got: $file_out) - wrong-arch compiler was likely used"
              exit 1
              ;;
          esac

          rm -rf "$workdir"

      - name: Remove debug spk and rename package
        run: |
          ls -l ./dist
          rm -f ./dist/*_debug.spk
          for f in ./dist/*.spk; do
            mv "$f" "./dist/${SPK_PREFIX}-${{ steps.arch_label.outputs.label }}-${{ steps.get_tag.outputs.new_tag }}-${{ steps.dsm_suffix.outputs.suffix }}.spk"
          done
          ls -l ./dist

      - name: Fix arch field in INFO for non-x86_64 DSM 7 platforms
        if: matrix.arch != 'kvmx64'
        run: |
          set -euo pipefail
          spk=$(ls ./dist/*.spk | head -n1)
          tmpdir=$(mktemp -d)
          tar -xf "$spk" -C "$tmpdir"
          sed -i '/^arch=/s/.*/arch="${{ steps.arch_label.outputs.label }}"/' "$tmpdir/INFO"
          tar -cf "$spk" -C "$tmpdir" $(ls "$tmpdir")
          rm -rf "$tmpdir"

      # Only needs to happen once - the noarch/DSM6 output doesn't
      # depend on which arch built it, and running it per matrix leg
      # would just produce duplicate, colliding artifacts.
      - name: Create noarch package for DSM 6
        if: matrix.arch == 'kvmx64'
        run: |
          for f in ./dist/${SPK_PREFIX}-${{ steps.arch_label.outputs.label }}-*.spk; do
            dsm6="${f/${{ steps.arch_label.outputs.label }}/noarch}"
            dsm6="${dsm6/${{ steps.dsm_suffix.outputs.suffix }}/DSM-6.x}"
            tmpdir=$(mktemp -d)
            tar -xf "$f" -C "$tmpdir"
            sed -i 's/arch=".*"/arch="noarch"/' "$tmpdir/INFO"
            sed -i -E 's/os_min_ver="7\.0-[0-9]+"/os_min_ver="6.0-7321"/' "$tmpdir/INFO"
            sed -i 's/os_max_ver="9.9-99999"/os_max_ver="6.9-99999"/' "$tmpdir/INFO"
            sed -i -E 's/install_dep_packages="[^"]*"/install_dep_packages="py3k>=3.8.6-0154"/' "$tmpdir/INFO"
            rm -rf "$tmpdir/WIZARD_UIFILES"
            rm -rf "$tmpdir/conf"
            rm -rf "$tmpdir/helper"
            tar -cf "$dsm6" -C "$tmpdir" $(ls "$tmpdir")
            rm -rf "$tmpdir"
          done
          ls -l ./dist

      # SRM 1.3 package, made from the DSM 6 noarch package. Differences:
      #  - INFO: SRM os_min_ver/os_max_ver and install_dep_packages=""
      #  - package.tgz is gzip (SRM can't unpack the xz that the builder makes)
      #  - scripts use the bundled static bash (SRM has no bash), so their
      #    shebangs point at ui/bin/bash, which postinst symlinks to the
      #    binary that runs on that router
      #  - static bash 5.2 is bundled (postinst symlinks ui/bin/bash)
      #  - static smartctl 7.5 is bundled (postinst symlinks ui/bin/smartctl7)
      #  - the DSM 7 helper (x86_64) is removed
      # Keep package.tgz first in the tar, like the SRM package that installed.
      - name: Create noarch package for SRM 1.3
        if: matrix.arch == 'kvmx64'
        run: |
          set -euo pipefail
          PKG_ID="drive_info"   # same name that api.cgi and postinst use
          BASH_PATH="/var/packages/${PKG_ID}/target/ui/bin/bash"

          for f in ./dist/${SPK_PREFIX}-noarch-*-DSM-6.x.spk; do
            srm="${f/DSM-6.x/SRM-1.3.x}"
            tmpdir=$(mktemp -d)
            pkgdir=$(mktemp -d)
            tar -xf "$f" -C "$tmpdir"
            tar -xf "$tmpdir/package.tgz" -C "$pkgdir"
            rm -f "$tmpdir/package.tgz"

            # DSM 7 helper is an x86_64 binary and is not used on SRM
            rm -rf "$pkgdir/bin/helper"

            # Bundled static bash and smartctl binaries. postinst keeps the
            # one that runs on the router and symlinks ui/bin/bash and
            # ui/bin/smartctl7 to it.
            for b in bash-armv7-hf-static bash-aarch64-static; do
              cp "$GITHUB_WORKSPACE/srm/bash/$b" "$pkgdir/ui/bin/$b"
              chmod 555 "$pkgdir/ui/bin/$b"
            done
            for b in smartctl-armv7-hf-static smartctl-aarch64-static; do
              cp "$GITHUB_WORKSPACE/srm/smartctl/$b" "$pkgdir/ui/bin/$b"
              chmod 555 "$pkgdir/ui/bin/$b"
            done

            # Scripts that need bash
            for s in ui/api.cgi ui/bin/drive_info.sh ui/bin/smart_info.sh \
                     ui/bin/smart_passive_info.sh ui/bin/check_ip_port.sh \
                     ui/bin/task_scheduler.sh ui/modules/get_text.sh; do
              if [ ! -f "$pkgdir/$s" ]; then
                echo "::error::$s not found in package"
                exit 1
              fi
              sed -i "1s|^#!.*bash.*\$|#!${BASH_PATH}|" "$pkgdir/$s"
              if [ "$(head -n 1 "$pkgdir/$s")" != "#!${BASH_PATH}" ]; then
                echo "::error::shebang of $s was not updated"
                exit 1
              fi
            done

            # api.cgi runs three scripts with a bare "bash", which SRM can't find
            sed -i 's/\bbash "\$\(CHECK_IP_SCRIPT\|SMART_SCRIPT\|SMART_PASSIVE_SCRIPT\)"/"$BASH" "$\1"/' "$pkgdir/ui/api.cgi"
            if [ "$(grep -c '"\$BASH" "\$' "$pkgdir/ui/api.cgi")" -ne 3 ] \
            || grep -qE '(^|[^A-Za-z_./"-])bash +"\$' "$pkgdir/ui/api.cgi"; then
              echo "::error::api.cgi bash calls were not all updated"
              exit 1
            fi

            # SRM's desktop is served from /webman/index.cgi, so the iframe's
            # relative src="webman/3rdparty/..." resolves to /webman/webman/...
            # and gives a 404. DSM 6/7 are served from / so they need the
            # relative form; only the SRM package gets the absolute one.
            js=$(ls "$pkgdir"/ui/${MAIN_JS_NAME}-*.js 2>/dev/null | head -n 1)
            if [ -z "$js" ]; then
              echo "::error::${MAIN_JS_NAME}-*.js not found in package"
              exit 1
            fi
            sed -i 's|src="webman/3rdparty/|src="/webman/3rdparty/|' "$js"
            if ! grep -q 'src="/webman/3rdparty/' "$js" \
            || grep -q 'src="webman/3rdparty/' "$js"; then
              echo "::error::iframe src in $js was not made absolute"
              exit 1
            fi

            # SRM needs gzip, not the xz that the package builder makes
            (cd "$pkgdir" && tar -czf "$tmpdir/package.tgz" $(ls -A))
            md5=$(md5sum "$tmpdir/package.tgz" | cut -d' ' -f1)

            sed -i -E 's/^os_min_ver=".*"/os_min_ver="1.3-9193"/' "$tmpdir/INFO"
            sed -i -E 's/^os_max_ver=".*"/os_max_ver="2.9-99999"/' "$tmpdir/INFO"
            sed -i -E '/^install_dep_packages=/d' "$tmpdir/INFO"
            sed -i -E "s/^checksum=\".*\"/checksum=\"${md5}\"/" "$tmpdir/INFO"
            sed -i -E "s/^extractsize=\".*\"/extractsize=\"$(du -sk "$pkgdir" | cut -f1)\"/" "$tmpdir/INFO"
            for k in os_min_ver os_max_ver checksum extractsize; do
              grep -q "^${k}=" "$tmpdir/INFO" || { echo "::error::$k missing from INFO"; exit 1; }
            done

            (cd "$tmpdir" && tar -cf "$OLDPWD/$srm" package.tgz INFO $(ls -A | grep -vxF -e package.tgz -e INFO))
            rm -rf "$tmpdir" "$pkgdir"
          done
          ls -l ./dist

      - name: Upload Package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SPK_PREFIX }}-${{ steps.arch_label.outputs.label }}-${{ steps.dsm_suffix.outputs.suffix }}-${{ steps.get_tag.outputs.new_tag }}
          path: ./dist/*.spk
